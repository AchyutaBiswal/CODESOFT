<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Developer profile illustration</title>
  <desc id="desc">Futuristic illustrated avatar with code elements and blue purple lighting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101a44"/>
      <stop offset=".52" stop-color="#18206a"/>
      <stop offset="1" stop-color="#25103f"/>
    </linearGradient>
    <linearGradient id="accent" x1=".1" x2=".9" y1=".1" y2=".9">
      <stop offset="0" stop-color="#25c2ff"/>
      <stop offset=".55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff4ecd"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
